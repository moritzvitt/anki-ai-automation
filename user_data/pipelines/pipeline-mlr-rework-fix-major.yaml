id: "pipeline-mlr-rework-fix-major"
name: "MLR Rework Fix Major"
enabled: true
note_selector:
  query: "note:\"Moritz Language Reactor\" tag:ai::audit::fix_major -is:suspended"
  limit: 15
steps:
  -
    id: "audit"
    type: "run_workflow"
    workflow_id: "mlr-audit"
  -
    id: "fill-japanese-notes-empty"
    type: "run_workflow"
    workflow_id: "workflow-mlr-fix-major-japanese-notes-empty"
    when:
      all:
        -
          artifact_equals:
            - "audit.status"
            - "FIXABLE_MAJOR"
        -
          artifact_contains:
            - "audit.fields_to_update"
            - "Japanese Notes"
        -
          field_empty: "Japanese Notes"
  -
    id: "draft-ai-japanese-notes"
    type: "run_workflow"
    workflow_id: "workflow-mlr-fix-major-ai-japanese-notes"
    when:
      all:
        -
          artifact_equals:
            - "audit.status"
            - "FIXABLE_MAJOR"
        -
          artifact_contains:
            - "audit.fields_to_update"
            - "Japanese Notes"
        -
          field_not_empty: "Japanese Notes"
  -
    id: "fill-notes-empty"
    type: "run_workflow"
    workflow_id: "workflow-mlr-fix-major-notes-empty"
    when:
      all:
        -
          artifact_equals:
            - "audit.status"
            - "FIXABLE_MAJOR"
        -
          artifact_contains:
            - "audit.fields_to_update"
            - "Notes"
        -
          field_empty: "Notes"
  -
    id: "draft-ai-notes"
    type: "run_workflow"
    workflow_id: "workflow-mlr-fix-major-ai-notes"
    when:
      all:
        -
          artifact_equals:
            - "audit.status"
            - "FIXABLE_MAJOR"
        -
          artifact_contains:
            - "audit.fields_to_update"
            - "Notes"
        -
          field_not_empty: "Notes"
  -
    id: "fill-grammar-empty"
    type: "run_workflow"
    workflow_id: "workflow-mlr-fix-major-grammar-empty"
    when:
      all:
        -
          artifact_equals:
            - "audit.status"
            - "FIXABLE_MAJOR"
        -
          artifact_contains:
            - "audit.fields_to_update"
            - "Grammar"
        -
          field_empty: "Grammar"
  -
    id: "draft-ai-grammar"
    type: "run_workflow"
    workflow_id: "workflow-mlr-fix-major-ai-grammar"
    when:
      all:
        -
          artifact_equals:
            - "audit.status"
            - "FIXABLE_MAJOR"
        -
          artifact_contains:
            - "audit.fields_to_update"
            - "Grammar"
        -
          field_not_empty: "Grammar"
