id: "pipeline-mlr-audit-first-15"
name: "MLR Audit First 15"
enabled: true
note_selector:
  query: "note:\"Moritz Language Reactor\" is:new -is:suspended -is:buried"
  limit: 15
steps:
  -
    id: "audit"
    type: "run_workflow"
    workflow_id: "mlr-audit"
  -
    id: "fix-japanese-notes"
    type: "run_workflow"
    workflow_id: "workflow-mlr-fix-minor-japanese-notes"
    when:
      all:
        -
          artifact_equals:
            - "audit.status"
            - "FIXABLE_MINOR"
        -
          artifact_equals:
            - "audit.auto_fix_allowed"
            - true
        -
          artifact_contains:
            - "audit.fields_to_update"
            - "Japanese Notes"
  -
    id: "fix-notes"
    type: "run_workflow"
    workflow_id: "workflow-mlr-fix-minor-notes"
    when:
      all:
        -
          artifact_equals:
            - "audit.status"
            - "FIXABLE_MINOR"
        -
          artifact_equals:
            - "audit.auto_fix_allowed"
            - true
        -
          artifact_contains:
            - "audit.fields_to_update"
            - "Notes"
  -
    id: "fix-word-definition"
    type: "run_workflow"
    workflow_id: "workflow-mlr-fix-minor-word-definition"
    when:
      all:
        -
          artifact_equals:
            - "audit.status"
            - "FIXABLE_MINOR"
        -
          artifact_equals:
            - "audit.auto_fix_allowed"
            - true
        -
          artifact_contains:
            - "audit.fields_to_update"
            - "Word Definition"
  -
    id: "fix-grammar"
    type: "run_workflow"
    workflow_id: "workflow-mlr-fix-minor-grammar"
    when:
      all:
        -
          artifact_equals:
            - "audit.status"
            - "FIXABLE_MINOR"
        -
          artifact_equals:
            - "audit.auto_fix_allowed"
            - true
        -
          artifact_contains:
            - "audit.fields_to_update"
            - "Grammar"
  -
    id: "mark-reject"
    type: "tag"
    add_tags:
      - "ai::review::mark"
    when:
      artifact_equals:
        - "audit.status"
        - "REJECT"
  -
    id: "suspend-reject"
    type: "suspend_cards"
    when:
      artifact_equals:
        - "audit.status"
        - "REJECT"
