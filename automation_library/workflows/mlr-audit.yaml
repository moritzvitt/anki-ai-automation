id: "mlr-audit"
name: "MLR Audit"
query: "note:\"Moritz Language Reactor\" is:new -is:suspended -is:buried limit:15"
workflow_type: "audit"
enabled: true
prompt_id: "mlr-audit-prompt"
target_field: ""
mode: "overwrite"
model: "gpt-5-mini"
temperature: null
api_mode: "responses"
system_prompt_id: "mlr-audit-system"
multiple_target_fields: false
convert_markdown_to_html: true
response_delimiter: null
schema_preset: "mlr_audit"
response_schema_json: null
note_type_filter: "Moritz Language Reactor"
clear_status_tags:
  - "ai::audit::good"
  - "ai::audit::fix_minor"
  - "ai::audit::fix_major"
  - "ai::audit::reject"
  - "ai::audit::skip"
status_tag_map:
  GOOD: "ai::audit::good"
  FIXABLE_MINOR: "ai::audit::fix_minor"
  FIXABLE_MAJOR: "ai::audit::fix_major"
  REJECT: "ai::audit::reject"
  SKIP: "ai::audit::skip"
extra_status_tags:
  FIXABLE_MAJOR:
    - "ai::review::manual"
  REJECT:
    - "ai::review::manual"
success_tags:
  - "ai::audit::checked"
  - "ai::audit::processed"
failure_tags:
  - "ai::audit::failed"
  - "ai::audit::processed"
metadata_field_map:
  status: "AI Audit Status"
  summary: "AI Audit Summary"
  confidence: "AI Audit Confidence"
  fields_to_update: "AI Fields To Update"
  last_checked: "AI Last Checked"
  raw: "AI Audit Raw"
store_raw_output: true
trigger_on_startup: false
trigger_on_periodic: false
trigger_min_matches: 1
group_ids:
  - "mlr-maintenance"
group_id: "mlr-maintenance"
position: 14
